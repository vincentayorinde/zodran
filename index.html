<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0a16"><meta name="description" content="ZODRAN - a cinematic cyber defence game. Defend the realm."><title>ZODRAN | Shadow Protocol</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#0b0a16;--panel:#151426;--edge:#ffffff27;--pink:#f6a1e8;--violet:#9277ff;--mint:#b2fa90;--white:#f8f3f9;--muted:#aeabc2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.38}.top{position:relative;z-index:9;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px clamp(20px,5vw,70px);border-bottom:1px solid var(--edge);background:#0b0a16b8;backdrop-filter:blur(15px)}.brand{font:900 29px 'Barlow Condensed',sans-serif;letter-spacing:3px;background:transparent;border:0;color:var(--white)}.brand em{color:var(--pink);font-style:normal}.nav{display:flex;gap:12px;flex-wrap:wrap}.nav button,.soft{background:transparent;border:1px solid var(--edge);padding:11px 15px;color:var(--white);border-radius:3px}.nav button:hover,.soft:hover{border-color:var(--pink)}.frame{max-width:1260px;margin:auto;padding:35px clamp(18px,5vw,65px) 95px}.hero{position:relative;overflow:hidden;min-height:630px;background:radial-gradient(ellipse at 55% 43%,#f080be8c,transparent 25%),linear-gradient(#282048 2%,#ab5e91 48%,#28163d 78%,#0b0a16 99%);isolation:isolate}.sun{position:absolute;width:300px;height:300px;border-radius:50%;background:linear-gradient(#ffdfbd,#ff98c6);left:56%;top:25%;filter:blur(1px);box-shadow:0 0 90px #ff9dccaa;z-index:-2}.skyline{position:absolute;bottom:0;left:0;width:100%;height:48%;display:flex;align-items:end;justify-content:space-around;z-index:-1}.building{width:9%;height:var(--h);background:linear-gradient(#252043,#0a0a17);box-shadow:0 0 0 2px #3d2559,12px 0 20px #0d071c}.building:before{content:"";display:block;margin:14px 12px;height:75%;background:repeating-linear-gradient(0deg,transparent 0 14px,#ffc0ef83 15px 17px,transparent 18px 25px);opacity:.45}.hero-inner{padding:clamp(70px,12vw,140px) clamp(20px,6vw,90px) 110px;max-width:780px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--pink)}h1,h2,h3,p{margin-top:0}h1{font:900 clamp(86px,15vw,195px)/.78 'Barlow Condensed',sans-serif;letter-spacing:-4px;margin:23px 0 36px;text-shadow:0 18px 45px #090511b8}h1 span{color:var(--pink)}h2{font:800 clamp(42px,6vw,80px)/.95 'Barlow Condensed',sans-serif;letter-spacing:-1px;margin:18px 0}h3{font:800 30px 'Barlow Condensed',sans-serif;letter-spacing:.4px}.hero-inner p{max-width:490px;line-height:1.8;color:#f5e6f5}.primary{border:0;background:var(--mint);color:#10130d;padding:16px 23px;font-weight:800;border-radius:3px;text-transform:uppercase;letter-spacing:.8px}.primary:hover{filter:brightness(1.09);transform:translateY(-1px)}.secondary{border:1px solid #ffffff77;background:#15112680;color:white;padding:15px 22px;font-weight:800;border-radius:3px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.sub{color:var(--muted);max-width:720px;line-height:1.8}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0}.stat{background:var(--panel);border:1px solid var(--edge);padding:20px;min-width:140px;flex:1}.stat small{color:var(--muted);display:block;font-size:11px;letter-spacing:2px}.stat b{font:800 28px 'Barlow Condensed',sans-serif}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{border:1px solid var(--edge);background:#161428;padding:27px;min-height:240px;display:flex;flex-direction:column;justify-content:space-between}.card p{color:var(--muted);line-height:1.6}.card .primary{width:100%}.district{background:linear-gradient(125deg,#503063,#141127);min-height:310px}.district:nth-child(2){background:linear-gradient(125deg,#273c58,#10111e)}.district:nth-child(3){background:linear-gradient(125deg,#47314a,#10111e)}.locked{opacity:.45}.case-icon{font-size:56px;display:block;margin:10px 0}.case-list{margin-top:32px}.meta{font-size:11px;color:var(--pink);font-weight:800;letter-spacing:2px}.case{min-height:360px}.mission-layout{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px}.inbox,.question{background:#171629;border:1px solid var(--edge);padding:27px;min-width:0}.message{background:#f8f4f5;color:#231d30;padding:24px;margin-top:18px;border-radius:4px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-line}.message b{display:block}.message small{display:block;color:#776a7a;margin:8px 0 14px}.link{display:block;color:#d3539f;font-weight:700;margin-top:10px}.clues{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.clue{background:#28243f;border:1px solid #5d5275;color:white;padding:10px}.clue-info{margin-top:16px;padding:16px;border-left:3px solid var(--pink);background:#30233b;line-height:1.6}.option{width:100%;background:#221f35;border:1px solid #ffffff27;color:var(--white);padding:16px;text-align:left;margin-bottom:10px;line-height:1.5}.option:hover:not(:disabled){border-color:var(--pink)}.option:disabled{opacity:.75}.option.selected{border-color:var(--pink);background:#413052}.feedback{padding:19px;background:#244234;border:1px solid #66b782;margin:14px 0;line-height:1.6}.feedback.bad{background:#51243f;border-color:#f49ebb}.progress{height:5px;background:#ffffff22;margin:20px 0}.progress i{display:block;height:100%;background:var(--mint);transition:width .25s}.banner{padding:20px;border:1px solid #ffffff30;background:#251e36;margin-top:25px;color:var(--muted);line-height:1.7}.input{padding:17px;background:#1d192e;color:white;border:1px solid #766a8b;width:100%;max-width:460px;margin:12px 0 18px}.board{width:100%;border-collapse:collapse;margin-top:30px}.board td,.board th{text-align:left;padding:19px;border-bottom:1px solid #ffffff22}.board th{color:var(--pink);font-size:11px;letter-spacing:2px}.self{background:#3a2646}.footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--edge);padding:26px clamp(20px,5vw,70px);font-size:11px;letter-spacing:2px;color:var(--muted)}.tiny{font-size:12px;color:var(--muted);line-height:1.7}.hero-caption{font-size:13px;color:#f7dbea;font-weight:700;letter-spacing:4px}button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:3px}@media(max-width:800px){.grid{grid-template-columns:1fr}.mission-layout{grid-template-columns:1fr}.top{flex-wrap:wrap}.hero{min-height:560px}.hero-inner{padding-top:100px}h1{font-size:100px}.sun{left:43%;top:29%;width:210px;height:210px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head>
<body><header class="top"><button class="brand" onclick="nav('home')" aria-label="Zodran home">✳ ZOD<em>RAN</em></button><nav class="nav"><button onclick="nav('map')">CITY MAP</button><button onclick="nav('leaderboard')">LEADERBOARD</button><button onclick="nav('vault')">THE VAULT</button></nav><span id="status" class="meta">OFFLINE / V0.1</span></header><main id="root"></main><footer class="footer"><span>© ZODRAN / SHADOW PROTOCOL</span><span>FICTIONAL THREATS · NO REAL MONEY</span><span>BUILD 001</span></footer>
<script>
'use strict';
const MISSIONS=[
{id:'ghost-delivery',name:'GHOST DELIVERY',icon:'📦',difficulty:'ROOKIE',summary:'A courier message is spreading across Solara. Find the trap before the city clicks.',steps:[
{kind:'SMS MESSAGE',from:'SOLARA PARCEL DESK',address:'+44 7700 900654',subject:'Final delivery attempt',body:'Your parcel is waiting. Delivery failed due to an outstanding £1.95 redelivery fee. Pay within 30 minutes to avoid return to sender.',link:'https://solara-parcel-pay.example/claim',clues:[['DOMAIN CHECK','An unverified courier domain is a warning sign.'],['PRESSURE TACTIC','The short deadline pushes you to act without checking.'],['FEE REQUEST','Unexpected small fees can lead to fraudulent payment pages.']],q:'What is the safest move?',choices:['Open the link to see what it asks for','Use the courier official website or app to check delivery','Reply with your address to identify the parcel'],correct:1,explain:'Verify the claimed delivery independently using the official courier website or app.'},
{kind:'EMAIL',from:'Delivery Support',address:'help@solara-parcels.example',subject:'Identity verification',body:'Reply with your password and one-time code to release your package. Do not contact customer service.',link:'Reply requested',clues:[['ONE-TIME CODE','Verification codes are sensitive account access secrets.'],['ISOLATION','The message discourages outside verification.']],q:'What should you do?',choices:['Share the code once','Send the code if the email looks professional','Do not share it; verify and report independently'],correct:2,explain:'Never disclose passwords or one-time codes in response to unsolicited messages.'}]},
{id:'silent-transfer',name:'SILENT TRANSFER',icon:'💳',difficulty:'OPERATIVE',summary:'An urgent CEO request could redirect an enormous supplier payment.',steps:[
{kind:'CORPORATE EMAIL',from:'Alex Morgan, CEO',address:'alex.morgan@solara-corp-pay.example',subject:'Urgent supplier payment',body:'Transfer £48,200 to our updated supplier account today. I am in a meeting. Do not call. Keep it confidential.',link:'New beneficiary: SC-8831-NEW',clues:[['LOOKALIKE DOMAIN','The email domain differs from the known corporate address.'],['PROCESS BYPASS','The message tries to bypass normal payment approval.']],q:'What should the employee do?',choices:['Transfer immediately','Verify using trusted contact details and approval procedure','Reply to this email to check'],correct:1,explain:'Verify account changes independently through trusted contacts and existing payment controls.'},
{kind:'SUPPLIER RECORD',from:'Accounts Payable',address:'Training record',subject:'Recent bank change',body:'Verified account ending 1142. New account ending 8870. Updated 11 minutes ago. Second approver: not recorded.',link:'£48,200 simulated payment',clues:[['CHANGED ACCOUNT','Unexpected beneficiary changes require verification.'],['MISSING APPROVAL','A required second approver is not recorded.']],q:'What action protects the company?',choices:['Pause, verify and complete dual approval','Pay now because the account exists','Split into smaller payments'],correct:0,explain:'Stop the payment until the new account has been independently verified and approved.'}]},
{id:'account-echo',name:'ACCOUNT ECHO',icon:'🪪',difficulty:'SPECIALIST',summary:'An unknown sign-in and a support impersonator threaten a personal account.',steps:[
{kind:'SECURITY ALERT',from:'Social account security',address:'Fictional notification',subject:'Unusual sign-in',body:'A sign-in request came from an unknown location. Someone claiming to be support is asking for your one-time code.',link:'One-time code: ••••••',clues:[['SUPPORT IMPERSONATION','Unsolicited support calls can be fraudulent.'],['CODE REQUEST','One-time codes must not be shared.']],q:'What is the strongest response?',choices:['Read the code to support','Do nothing','Do not share; open the official app to review activity'],correct:2,explain:'Use the official app independently to check sign-in activity and protect your account.'},
{kind:'SESSION REVIEW',from:'Account activity',address:'Training dashboard',subject:'Active sessions',body:'Trusted laptop: active. Unknown browser: active. Unknown phone: active. Multi-factor authentication: disabled.',link:'Actions: revoke / reset / enable MFA',clues:[['UNKNOWN SESSIONS','Unrecognised sessions may indicate compromise.'],['MFA OFF','Multi-factor authentication helps protect account access.']],q:'Choose the best recovery sequence.',choices:['Change the profile photo','Revoke unknown sessions, reset the password and enable MFA','Delete all inbox messages'],correct:1,explain:'Revoke unknown sessions, reset to a unique password, enable MFA and review recovery methods.'}]}];
const KEY='zodran_demo_v1',OLD='zekran_demo_v1',empty=()=>({name:'',xp:0,credits:0,completed:{}});
let state;try{state={...empty(),...JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)||'{}')}}catch{state=empty()}
let page='home',mission=null,step=0,answers=[],chosen=-1,selectedClue=-1;const root=document.getElementById('root');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const rank=()=>state.xp>=950?'NIGHT SENTINEL':state.xp>=600?'ELITE DEFENDER':state.xp>=300?'FIELD AGENT':'ROOKIE';
const btn=(label,action,cls='primary')=>'<button class="'+cls+'" data-action="'+action+'">'+label+'</button>';
function nav(p){page=p;mission=null;step=0;chosen=-1;selectedClue=-1;render();scrollTo(0,0)}
function skyline(){return '<div class="sun"></div><div class="skyline">'+[38,77,51,93,60,72,48,87,54,68,45].map(n=>'<div class="building" style="--h:'+n+'%"></div>').join('')+'</div>'}
function home(){return '<section class="hero">'+skyline()+'<div class="hero-inner"><div class="eyebrow">SHADOW PROTOCOL / SOLARA CITY</div><h1>ZOD<span>RAN</span></h1><div class="hero-caption">THE CITY IS COMPROMISED. YOUR MOVE.</div><p>A cyber-thriller you do not just watch. Investigate digital crime, expose deception and defend a city that never logs off.</p><div class="actions">'+btn(state.name?'CONTINUE OPERATION ↗':'ENTER THE GAME ↗',state.name?'map':'enlist')+btn('HOW TO PLAY ↗','about','secondary')+'</div></div></section><section class="frame"><div class="grid"><div class="card"><div class="meta">01 / INVESTIGATE</div><h3>READ THE SIGNAL.</h3><p>Inspect messages, accounts and evidence.</p></div><div class="card"><div class="meta">02 / DECIDE</div><h3>MAKE YOUR MOVE.</h3><p>Every decision has a consequence.</p></div><div class="card"><div class="meta">03 / PROGRESS</div><h3>DEFEND THE CITY.</h3><p>Level up by applying real security skills.</p></div></div></section>'}
function enlist(){return '<section class="frame"><span class="eyebrow">OPERATOR INTAKE / 001</span><h2>WHO ARE <span style="color:var(--pink)">YOU?</span></h2><p class="sub">Choose your callsign. Your progress is stored on this device.</p><form id="signup"><label for="callsign" class="meta">YOUR CALLSIGN</label><br><input class="input" id="callsign" autocomplete="off" minlength="2" maxlength="18" pattern="[A-Za-z0-9 _-]{2,18}" required placeholder="GHOST77"><br><button class="primary">ACTIVATE OPERATOR ↗</button></form><p class="tiny">No login, real payments or connected accounts.</p></section>'}
function stats(){return '<div class="stats"><div class="stat"><small>AGENT RANK</small><b>'+rank()+'</b></div><div class="stat"><small>EXPERIENCE</small><b>'+state.xp+' XP</b></div><div class="stat"><small>Z-CREDITS</small><b>'+state.credits+'</b></div></div>'}
function map(){return '<section class="frame"><span class="eyebrow">SOLARA CITY / OPERATION CONTROL</span><h2>CHOOSE YOUR TERRITORY.</h2><p class="sub">Five districts. One city under siege. Start in Neon District.</p>'+stats()+'<div class="grid">'+[['NEON DISTRICT','ACTIVE','01'],['FINANCIAL QUARTER','COMING SOON','02'],['IDENTITY ROW','COMING SOON','03'],['SHADOW MARKET','COMING SOON','04'],['CORPORATE HEIGHTS','COMING SOON','05']].map(([n,s,i],j)=>'<div class="card district '+(j?'locked':'')+'"><span class="meta">DISTRICT '+i+' / '+s+'</span><h3>'+n+'</h3>'+(j?'<span class="tiny">LOCKED</span>':btn('INVESTIGATE ↗','missions'))+'</div>').join('')+'</div><div class="banner">All threats, accounts and payment requests are fictional. Completing missions does not interact with real people or systems.</div></section>'}
function missions(){return '<section class="frame"><span class="eyebrow">NEON DISTRICT / MISSION BOARD</span><h2>ACTIVE CASES.</h2><p class="sub">Complete both decisions in a case to unlock the next. Replaying can improve your best score.</p>'+stats()+'<div class="grid case-list">'+MISSIONS.map((m,i)=>{let locked=i>0&&!state.completed[MISSIONS[i-1].id];return '<div class="card case"><span class="meta">CASE 0'+(i+1)+' / '+m.difficulty+'</span><span class="case-icon">'+m.icon+'</span><h3>'+m.name+'</h3><p>'+m.summary+'</p><button class="primary" '+(locked?'disabled':'data-start="'+m.id+'"')+'>'+(locked?'LOCKED':state.completed[m.id]?'REPLAY CASE ↗':'ACCEPT MISSION ↗')+'</button></div>'}).join('')+'</div></section>'}
function play(id){let m=MISSIONS.find(x=>x.id===id),i=MISSIONS.indexOf(m);if(!m||(i>0&&!state.completed[MISSIONS[i-1].id]))return;mission=m;page='play';step=0;answers=[];chosen=-1;selectedClue=-1;render();scrollTo(0,0)}
function playView(){let s=mission.steps[step];return '<section class="frame"><button class="soft" data-action="missions">← ABORT CASE</button><p class="eyebrow" style="margin-top:25px">CASE / '+mission.difficulty+' / SCENE '+(step+1)+' OF '+mission.steps.length+'</p><h2>'+mission.name+'</h2><div class="progress"><i style="width:'+((step+1)/mission.steps.length*100)+'%"></i></div><div class="mission-layout"><div class="inbox"><div class="meta">EVIDENCE / '+s.kind+'</div><div class="message"><b>'+esc(s.from)+'</b><small>FROM: '+esc(s.address)+'</small><strong>'+esc(s.subject)+'</strong><p style="margin:16px 0">'+esc(s.body)+'</p><span class="link">'+esc(s.link)+'</span></div><p class="tiny" style="margin-top:14px">FICTIONAL TRAINING MATERIAL / LINKS ARE INERT</p><div class="clues">'+s.clues.map((c,i)=>'<button class="clue" data-clue="'+i+'">◈ '+esc(c[0])+'</button>').join('')+'</div>'+(selectedClue>=0?'<div class="clue-info"><b>'+esc(s.clues[selectedClue][0])+'</b><p>'+esc(s.clues[selectedClue][1])+'</p></div>':'')+'</div><div class="question"><span class="eyebrow">CRITICAL DECISION / '+(step+1)+'</span><h3 style="margin-top:20px">'+esc(s.q)+'</h3><p class="sub">Read the evidence and select the action that best protects the victim.</p>'+s.choices.map((c,i)=>'<button class="option '+(chosen===i?'selected':'')+'" data-choice="'+i+'" '+(chosen>=0?'disabled':'')+'><span class="meta">0'+(i+1)+' / </span>'+esc(c)+'</button>').join('')+(chosen>=0?'<div class="feedback '+(chosen===s.correct?'':'bad')+'"><b>'+(chosen===s.correct?'✓ THREAT NEUTRALISED':'✕ SECURITY BREACH')+'</b><p>'+esc(s.explain)+'</p></div>'+btn(step+1===mission.steps.length?'FINALISE CASE ↗':'NEXT TRANSMISSION ↗','next'):'<p class="tiny">One decision per scene. Review the clues carefully.</p>')+'</div></div></section>'}
function next(){if(chosen<0)return;answers[step]=chosen;if(step+1<mission.steps.length){step++;chosen=-1;selectedClue=-1;render();scrollTo(0,0)}else finish()}
function finish(){let correct=answers.filter((a,i)=>a===mission.steps[i].correct).length,xp=correct*150+50,credits=correct*20+5,prev=state.completed[mission.id];if(!prev||correct>prev.correct){state.xp+=xp-(prev?.xp||0);state.credits+=credits-(prev?.credits||0);state.completed[mission.id]={correct,xp,credits};save()}page='result';render();scrollTo(0,0)}
function result(){let c=answers.filter((a,i)=>a===mission.steps[i].correct).length;return '<section class="frame" style="text-align:center;padding-top:100px"><span class="eyebrow">CASE CLOSED / '+esc(mission.name)+'</span><h2>'+(c===2?'FLAWLESS DEFENCE.':'MISSION COMPLETE.')+'</h2><p class="sub" style="margin:auto">Decisions correct: '+c+' / '+mission.steps.length+'. Your best score is saved. Replay to improve your response.</p>'+stats()+'<div class="actions" style="justify-content:center">'+btn('NEXT ASSIGNMENT ↗','missions')+btn('REPLAY CASE','replay','secondary')+'</div></section>'}
function leaderboard(){let rows=[{name:'NOVA_7',xp:1450},{name:'CIPHER_X',xp:1175},{name:'SOLARIS',xp:920},{name:state.name||'YOU',xp:state.xp,self:true}].sort((a,b)=>b.xp-a.xp);return '<section class="frame"><span class="eyebrow">LOCAL DEMO / FICTIONAL RIVALS</span><h2>TOP OPERATORS.</h2><p class="sub">Sample competitors are fictional, not connected to any real leaderboard.</p><table class="board"><tr><th>RANK</th><th>OPERATOR</th><th>EXPERIENCE</th></tr>'+rows.map((r,i)=>'<tr class="'+(r.self?'self':'')+'"><td>0'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+r.xp+' XP</td></tr>').join('')+'</table></section>'}
function vault(){return '<section class="frame"><span class="eyebrow">OPERATOR ECONOMY / DEMO ONLY</span><h2>THE VAULT.</h2>'+stats()+'<div class="grid"><div class="card"><span class="meta">FICTIONAL CURRENCY</span><h3>Z-CREDITS</h3><p>'+state.credits+' points earned through training. These cannot be redeemed for money or goods.</p></div><div class="card"><span class="meta">NOT AVAILABLE</span><h3>SPONSORED MISSIONS</h3><p>Future research concept. No prizes, payouts, deposits or payments are supported.</p></div><div class="card"><span class="meta">LOCAL DATA</span><h3>RESET YOUR PROFILE</h3><p>Clear your callsign, XP, credits and results from this browser.</p>'+btn('RESET PROGRESS','reset','secondary')+'</div></div></section>'}
function about(){return '<section class="frame"><span class="eyebrow">FIELD MANUAL / PROTOCOL 001</span><h2>KNOW THE RULES.</h2><div class="grid"><div class="card"><h3>01 / OBSERVE</h3><p>Inspect evidence and investigate warning signs.</p></div><div class="card"><h3>02 / DECIDE</h3><p>Choose the safest action in each scenario.</p></div><div class="card"><h3>03 / PROGRESS</h3><p>Earn fictional XP, rise through ranks and replay cases.</p></div></div><div class="banner">This is an educational game. The city, accounts, incidents and players are fictional.</div><div class="actions">'+btn('BECOME AN OPERATOR ↗',state.name?'map':'enlist')+'</div></section>'}
function render(){document.getElementById('status').textContent=(state.name||'UNREGISTERED')+' / V0.1';root.innerHTML=({home,enlist,map,missions,play:playView,result,leaderboard,vault,about}[page])()}
root.addEventListener('submit',e=>{if(e.target.id!=='signup')return;e.preventDefault();const name=document.getElementById('callsign').value.trim();if(!/^[A-Za-z0-9 _-]{2,18}$/.test(name))return;state.name=name.toUpperCase();save();nav('map')});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.start){play(b.dataset.start);return}if(b.dataset.clue!==undefined&&page==='play'){selectedClue=Number(b.dataset.clue);render();return}if(b.dataset.choice!==undefined&&page==='play'&&chosen<0){chosen=Number(b.dataset.choice);render();return}const a=b.dataset.action;if(['home','enlist','map','missions','leaderboard','vault','about'].includes(a))nav(a);else if(a==='next'&&page==='play')next();else if(a==='replay'&&mission)play(mission.id);else if(a==='reset'&&confirm('Erase your ZODRAN game progress?')){state=empty();save();nav('home')}});
window.nav=nav;render();
</script></body></html>
